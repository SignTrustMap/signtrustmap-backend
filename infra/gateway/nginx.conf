map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;

    # Docker internal DNS resolver for dynamic upstream discovery
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Allow large media file uploads (dashcam MP4 up to 2GB)
    client_max_body_size 2048M;
    client_body_buffer_size 512k;

    # Extended timeouts for long-running batch ingestion and video uploads
    proxy_connect_timeout 60s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;
    send_timeout 3600s;

    # Response compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Gateway Health Check
    location /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","gateway":"stm-gateway"}';
    }

    # Flow 6 & 7: Spatial GIS & Real-time WebSocket Navigation (FastAPI)
    location /api/v1/spatial {
        set $fastapi_backend "http://api-fastapi:8000";
        proxy_pass $fastapi_backend;
        proxy_http_version 1.1;

        # WebSocket support (for /api/v1/spatial/navigation/stream)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
    }

    # AI Model Management, Active Learning & Inference (signtrustmap-ai)
    location ~ ^/api/v1/(models|system|active-learning|classes|config|inference) {
        set $ai_backend "http://ai-inference:8000";
        proxy_pass $ai_backend;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Core Business Domain REST APIs (NestJS Modular Monolith)
    location /api/v1 {
        set $nestjs_backend "http://api-nestjs:3000";
        proxy_pass $nestjs_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API Documentation (Scalar / Swagger)
    location /docs {
        set $nestjs_backend "http://api-nestjs:3000";
        proxy_pass $nestjs_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Root Welcome
    location = / {
        default_type application/json;
        return 200 '{"name":"SignTrustMap API Gateway","status":"online","docs":"/docs","health":"/health"}';
    }
}
