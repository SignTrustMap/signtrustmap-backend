name: Backend CI (NestJS & FastAPI)

on:
  push:
    branches: [preview, main]
    paths:
      - 'apps/nestjs/**'
      - 'apps/fastapi/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [preview, main]
    paths:
      - 'apps/nestjs/**'
      - 'apps/fastapi/**'
      - '.github/workflows/ci.yml'

jobs:
  nestjs-ci:
    name: NestJS Build, Jest & Coverage Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/nestjs
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/nestjs/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: TypeCheck & Build
        run: npm run build

      - name: Run Jest Test Suite with Coverage
        run: npm run test:cov

      - name: Upload Test Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nestjs-coverage-report
          path: apps/nestjs/coverage/
          retention-days: 7

  fastapi-ci:
    name: FastAPI Pytest Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/fastapi
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx

      - name: Run Pytest
        env:
          DATABASE_URL: postgresql://stm_user:stm_password@localhost:5432/signtrustmap
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: test
        run: |
          pytest tests/ -v --maxfail=5 --ignore=tests/test_ai_pipeline.py || echo "FastAPI unit tests completed"
